<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>IMFine — Daily Check-in</title>
<meta name="theme-color" content="#10b981" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="IMFine" />
<style>
  :root{
    --green:#10b981;--green-d:#059669;--green-l:#ecfdf5;--green-b:#d1fae5;
    --amber:#f59e0b;--amber-l:#fef3c7;--amber-b:#fde68a;
    --red:#ef4444;--red-l:#fee2e2;--red-b:#fecaca;
    --sky:#0284c7;--sky-l:#e0f2fe;--sky-b:#bae6fd;
    --ink:#0f172a;--slate:#64748b;--slate2:#94a3b8;--line:#e2e8f0;--bg:#eef2f6;--card:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--green-l);display:flex;flex-direction:column;overflow:hidden;position:relative;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .pad{padding:22px 20px}
  .center{text-align:center}
  h2{font-size:26px;font-weight:800;margin:0}
  .muted{color:var(--slate);font-size:16px}
  .small{font-size:13px;color:var(--slate)}
  .tiny{font-size:11px;color:var(--slate2)}
  .grow{flex:1}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between}
  .logo{width:80px;height:80px;border-radius:24px;display:grid;place-items:center;margin:0 auto;background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 12px 24px rgba(5,80,60,.28)}
  .logo svg{width:44px;height:44px}
  .btn{border:0;border-radius:18px;font-size:16px;font-weight:700;padding:15px;width:100%;cursor:pointer;transition:transform .08s ease;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.97)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn:disabled{opacity:.5}
  .btn-green{background:var(--green);color:#fff}.btn-sky{background:var(--sky);color:#fff}
  .btn-amber{background:var(--amber);color:#fff}.btn-ghost{background:#fff;color:var(--slate);border:1px solid var(--line)}
  .card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .choice{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border-radius:24px;padding:16px;background:#fff;border:2px solid var(--green-b);cursor:pointer;transition:transform .08s}
  .choice.sky{border-color:var(--sky-b)}.choice:active{transform:scale(.97)}
  .choice .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
  .choice .ic.g{background:var(--green-l)}.choice .ic.s{background:var(--sky-l)}
  .choice h3{margin:0;font-size:19px}.choice p{margin:2px 0 0;font-size:14px;color:var(--slate)}
  label.fl{font-size:13px;color:var(--slate);display:block;margin-top:12px;margin-bottom:5px}
  input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;background:#fff}
  input:focus{border-color:var(--green)}
  .topbar{display:flex;align-items:center;gap:10px;padding:18px 16px 8px;position:relative;z-index:5}
  .back{width:44px;height:44px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;box-shadow:0 1px 3px rgba(15,23,42,.08);cursor:pointer;flex:none}
  .back svg{width:22px;height:22px}
  .barlabel{font-weight:700;font-size:14px}
  .okwrap{display:grid;place-items:center;margin:10px 0}
  .okbtn{position:relative;border:0;background:transparent;cursor:pointer}
  .okbtn .disc{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 16px 30px rgba(5,80,60,.3)}
  .okbtn:active .disc{transform:scale(.96)}
  .okbtn .ring{position:absolute;inset:0;border-radius:50%;background:#34d399;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.95);opacity:.6}70%{transform:scale(1.28);opacity:0}100%{opacity:0}}
  .okbtn .lbl{font-size:24px;font-weight:800;margin-top:4px}
  .disc.done{background:var(--green)}
  .toggle{width:46px;height:26px;border-radius:20px;border:0;padding:3px;cursor:pointer;background:#cbd5e1}
  .toggle.on{background:var(--green)}
  .toggle .dot{width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;display:block}
  .toggle.on .dot{transform:translateX(20px)}
  .glist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .gitem{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border-radius:14px;padding:10px 12px}
  .trash{border:0;background:transparent;color:var(--slate2);cursor:pointer;padding:8px;border-radius:10px}
  .trash svg{width:22px;height:22px;display:block}
  .gitem .trash{background:#fff;border:1px solid var(--line);color:var(--red)}
  .chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .step{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff;opacity:.55}
  .step.on{opacity:1;border-color:var(--amber-b);background:var(--amber-l)}
  .step.on.fs{border-color:var(--red-b);background:var(--red-l)}
  .step .sic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:#e2e8f0;color:#94a3b8}
  .step.on .sic{background:var(--amber);color:#fff}.step.on.fs .sic{background:var(--red);color:#fff}
  .step b{font-size:14px;display:block}
  .msgcard{background:var(--ink);color:#fff;border-radius:16px;padding:12px;margin-top:12px}
  .maprow{display:flex;gap:8px;align-items:center;background:#1e293b;border-radius:10px;padding:8px;margin-top:8px;font-size:12px}
  .statuscard{border-radius:24px;padding:22px;text-align:center;color:#fff;box-shadow:0 12px 24px rgba(15,23,42,.12)}
  .statuscard .badge{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto}
  .feed{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .fitem{display:flex;gap:8px;align-items:flex-start;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .fitem .dotc{width:8px;height:8px;border-radius:50%;background:var(--sky);margin-top:6px;flex:none}
  .fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 8px 18px rgba(15,23,42,.25);cursor:pointer;z-index:20}
  .fab svg{width:24px;height:24px}
  .sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;z-index:30}
  .sheet .inner{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .hidden{display:none !important}
  .banner{background:var(--amber-l);color:#92610a;border-radius:14px;padding:10px 12px;font-size:12px}
  .codebox{font-family:monospace;font-size:26px;font-weight:800;letter-spacing:6px;text-align:center;background:var(--green-l);border:2px dashed var(--green-b);border-radius:14px;padding:12px;color:var(--green-d)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;max-width:90%;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
  .spin{width:34px;height:34px;border:3px solid var(--green-b);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .link{background:none;border:0;color:var(--green-d);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ============ CONFIG (public values — safe in the browser) ============ */
const SUPABASE_URL  = "https://zsxhkszxnzabieivhsrb.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzeGhrc3p4bnphYmllaXZoc3JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NDU0OTYsImV4cCI6MjA5OTIyMTQ5Nn0.osF22Nq9ApUPsSYYXSi_HUe8xX1xNLDKfFldlfVCar0";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
const VAPID_PUBLIC = "BMTqQk6I3xtWNjq7sXnpHudDGYVivt64Z7A7e4J5Fa6hNmcHDMX7wFh8SW61hNaG0CymMYNL493aKXIgup7CoEo";

function urlB64ToUint8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(s); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
/* ============ native (Capacitor) push detection ============ */
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const nativePlatform = () => (window.Capacitor && window.Capacitor.getPlatform) ? window.Capacitor.getPlatform() : 'web';
// Capacitor plugins are compiled INTO the app and exposed on window.Capacitor.Plugins.
function loadNativePush(){
  if(!isNative()) return null;
  const P = window.Capacitor && window.Capacitor.Plugins;
  return (P && P.PushNotifications) ? P.PushNotifications : null;
}
async function registerNativePush(){
  const PN = loadNativePush();
  if(!PN) { toast('Push plugin not found in this build'); return false; }
  return new Promise(async (resolve)=>{
    let settled=false;
    const done=(v)=>{ if(!settled){settled=true;resolve(v);} };
    try{
      try{ await PN.removeAllListeners(); }catch(_){}
      // Save the device token when iOS hands it to us.
      await PN.addListener('registration', async (t)=>{
        try{
          // Remove any old token rows for this user, then upsert the new one.
          await supabase.from('native_push_tokens').delete().eq('user_id',S.user.id);
          const {error}=await supabase.from('native_push_tokens')
            .upsert({user_id:S.user.id, token:t.value, platform:nativePlatform()==='android'?'android':'ios'},{onConflict:'token'});
          if(error) throw error;
          await refreshPushState();          // read the truth back from the database
          sheetOpen=false; render();
          toast(S.pushSubscribed?'Notifications turned on ✓':'Saved, but state not confirmed');
        }catch(e){ toast('Token save failed: '+(e.message||JSON.stringify(e))); }
        done(true);
      });
      await PN.addListener('registrationError', (e)=>{
        toast('Push registration failed: '+((e&&(e.error||e.message))||''));
        done(false);
      });
      // Tapping a notification opens the app.
      await PN.addListener('pushNotificationActionPerformed', ()=>{ boot(); });

      let perm = await PN.checkPermissions();
      if(perm.receive !== 'granted') perm = await PN.requestPermissions();
      if(perm.receive !== 'granted'){ toast('Notifications were not enabled.'); done(false); return; }
      await PN.register();
    }catch(e){ toast(e.message||'Push error'); done(false); }
  });
}
async function unregisterNativePush(){
  try{
    const PN = loadNativePush();
    if(PN) { try{ await PN.removeAllListeners(); }catch(_){} }
    await supabase.from('native_push_tokens').delete().eq('user_id',S.user.id);
    S.pushSubscribed=false; sheetOpen=false; render(); toast('Notifications turned off');
  }catch(e){ toast('Could not turn off notifications'); }
}

async function refreshPushState(){
  try{
    if(isNative()){
      if(!S.user){S.pushSubscribed=false;return;}
      const {data}=await supabase.from('native_push_tokens').select('id').eq('user_id',S.user.id).limit(1);
      S.pushSubscribed=!!(data&&data.length);
      return;
    }
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){S.pushSubscribed=false;return;}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    S.pushSubscribed=!!sub;
  }catch(_){ S.pushSubscribed=false; }
}
async function subscribePush(){
  if(isNative()){ await registerNativePush(); return; }
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||typeof Notification==='undefined'){
      toast('Notifications aren\'t supported here. On iPhone, add IMFine to your Home Screen first.');return;
    }
    toast('Requesting permission…');
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Permission was '+perm+'. Enable notifications for IMFine in your phone settings.');return;}
    const reg=await navigator.serviceWorker.ready;
    let key=VAPID_PUBLIC;
    try{ const kr=await fetch('/api/send-push',{cache:'no-store'}); const kj=await kr.json(); if(kj&&kj.vapidPublicKey) key=kj.vapidPublicKey; }catch(_){}
    const existing=await reg.pushManager.getSubscription();
    if(existing){ try{ await existing.unsubscribe(); }catch(_){} }
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(key)});
    await supabase.from('push_subscriptions').delete().eq('user_id',S.user.id);
    await supabase.from('push_subscriptions').insert({user_id:S.user.id, subscription:sub.toJSON()});
    S.pushSubscribed=true; sheetOpen=false; render(); toast('Notifications turned on ✓');
  }catch(e){ toast(e.message||'Could not enable notifications'); }
}
async function unsubscribePush(){
  if(isNative()){ await unregisterNativePush(); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){ try{ await sub.unsubscribe(); }catch(_){} }
    await supabase.from('push_subscriptions').delete().eq('user_id',S.user.id);
    S.pushSubscribed=false; sheetOpen=false; render(); toast('Notifications turned off');
  }catch(e){ toast(e.message||'Could not turn off notifications'); }
}
function pushCard(){
  if(!isNative() && (!('serviceWorker' in navigator)||!('PushManager' in window))) return '';
  if(S.pushSubscribed){
    return `<div class="card between" style="margin-top:12px"><div class="row"><span style="width:22px;height:22px;color:var(--green)">${I.bell}</span><span class="small" style="color:var(--ink)">Notifications are on</span></div><button class="btn btn-ghost" style="width:auto;padding:9px 16px" data-a="disable-push">Turn off</button></div>`;
  }
  return `<div class="card between" style="margin-top:12px"><div class="row"><span style="width:22px;height:22px;color:var(--green)">${I.bell}</span><span class="small" style="color:var(--ink)">Turn on notifications</span></div><button class="btn btn-green" style="width:auto;padding:9px 16px" data-a="enable-push">Enable</button></div>`;
}
async function upgradeTo(plan){
  try{
    const {data:{session}}=await supabase.auth.getSession();
    const token=session&&session.access_token;
    if(!token){toast('Please sign in first');return;}
    toast('Opening secure checkout…');
    const r=await fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({plan})});
    const j=await r.json();
    if(j.url){ await openExternal(j.url); } else { toast(j.error||'Could not start checkout'); }
  }catch(e){ toast(e.message||'Checkout error'); }
}
// On native, open external pages in an in-app browser (with a Done button)
// so the user can close it and come straight back to IMFine.
async function openExternal(url){
  if(isNative()){
    const P = window.Capacitor && window.Capacitor.Plugins;
    if(P && P.Browser){
      try{
        await P.Browser.removeAllListeners();
        await P.Browser.addListener('browserFinished', async ()=>{
          // Refresh plan/state when they close the Stripe page.
          await loadSeniorData(); render();
        });
      }catch(_){}
      await P.Browser.open({url});
      return;
    }
  }
  window.location.href = url;
}
async function openPortal(){
  try{
    const {data:{session}}=await supabase.auth.getSession();
    const token=session&&session.access_token;
    if(!token){toast('Please sign in first');return;}
    toast('Opening your subscription…');
    const r=await fetch('/api/create-portal',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});
    const j=await r.json();
    if(j.url){ await openExternal(j.url); } else { toast(j.error||'Could not open subscription'); }
  }catch(e){ toast(e.message||'Portal error'); }
}
function planCard(){
  const premium = S.settings && S.settings.plan==='premium';
  if(!premium) return '';
  return `<div class="card" style="margin-top:12px">
    <div class="between">
      <span class="row" style="font-weight:700;font-size:14px"><span style="width:18px;height:18px;color:var(--amber)">${I.crown}</span>Premium plan</span>
      <span class="pill">Active</span>
    </div>
    <p class="tiny" style="margin:6px 0 10px">Up to 5 Guardians and extra alert channels.</p>
    <button class="btn btn-ghost" data-a="open-portal">Manage or cancel subscription</button>
  </div>`;
}
function upgradeCard(){
  if(S.settings&&S.settings.plan==='premium') return '';
  return `<div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between"><span class="row" style="font-weight:700;font-size:14px"><span style="width:18px;height:18px;color:var(--amber)">${I.crown}</span>Upgrade to Premium</span></div>
    <p class="tiny" style="margin:6px 0 10px">Up to 5 Guardians, voice-call alerts, and more.</p>
    <div class="row">
      <button class="btn btn-green" data-a="upgrade-monthly">SGD 2.99 / month</button>
      <button class="btn btn-ghost" data-a="upgrade-yearly">SGD 24.99 / year</button>
    </div>
  </div>`;
}


/* ============ icons ============ */
const I={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  hands:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-9.5-8.5C1 9 3 6 6 6c1.8 0 3 1 3 1s1.2-1 3-1"/><path d="M12 8l3 3 6-6"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l.9-4.4A8 8 0 1 1 21 12z"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 6a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8 3 3M17 6l2 2"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 9v5M12 17h.01"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',

const CHAIN=[
  {key:'r1',title:'Gentle reminder',real:'at the missed window',detail:'Push: "Time to check in."',ic:I.bell},
  {key:'r2',title:'Louder alarm',real:'~1 hour later',detail:'Repeated push and a louder alert.',ic:I.bell},
  {key:'r3',title:'Final alarm',real:'~3 hours later',detail:'Last attempt before Guardians are alerted.',ic:I.alert},
  {key:'fs',title:'Guardians alerted',real:'grace period elapsed',detail:'Push + email + location sent.',ic:I.shield},
];
const LOC={lat:1.3521,lng:103.8198,place:'Ang Mo Kio Ave 3, Singapore'};
const code6=()=>String(Math.floor(100000+Math.random()*900000));
const fmt=(d)=>new Date(d).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});

/* ============ state ============ */
let S={screen:'loading', user:null, role:localStorage.getItem('imfine_role')||null,
  settings:null, guardians:[], events:[], stepIdx:-1, gpsShared:false, gLink:null, seniorName:'', profileName:'', pushSubscribed:false};
let sheetOpen=false, escTimers=[], pollTimer=null, authMode='signin';

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function clearEsc(){escTimers.forEach(clearTimeout);escTimers=[];}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}

/* ============ auth ============ */
async function boot(){
  if(new URLSearchParams(location.search).get('upgraded')){
    toast('Payment received (test). Premium activates shortly.');
    history.replaceState({},'',location.pathname);
  }
  const {data:{session}}=await supabase.auth.getSession();
  S.user=session?.user||null;
  if(!S.user){S.screen='welcome';return render();}
  await refreshPushState();
  await routeByRole();
}
async function routeByRole(){
  if(S.role==='guardian'){await loadGuardianData();}
  else{S.role='senior';await loadSeniorData();S.screen=(S.profileName?'senior':'seniorSetup');}
  render();
}
async function doAuth(email,password){
  try{
    let res;
    if(authMode==='signup'){
      res=await supabase.auth.signUp({email,password});
      if(res.error) throw res.error;
      // Supabase returns a user with empty identities when the email already exists.
      if(res.data.user && Array.isArray(res.data.user.identities) && res.data.user.identities.length===0){
        toast('That email is already registered. Please sign in instead.');
        authMode='signin'; render(); return;
      }
      if(!res.data.session){toast('Almost there — check your email to confirm, then sign in.');return;}
    } else {
      res=await supabase.auth.signInWithPassword({email,password});
      if(res.error) throw res.error;
    }
    if(!res.data.session){toast('Check your email to confirm, then sign in.');return;}
    S.user=res.data.session.user;
    await refreshPushState();
    await routeByRole();
  }catch(e){toast(e.message||'Sign-in failed');}
}
async function signOut(){clearEsc();stopPoll();await supabase.auth.signOut();S.user=null;S.role=null;localStorage.removeItem('imfine_role');S.screen='welcome';sheetOpen=false;render();}

/* ============ data: senior ============ */
async function loadSeniorData(){
  const uid=S.user.id;
  let {data:st}=await supabase.from('senior_settings').select('*').eq('senior_id',uid).maybeSingle();
  if(!st){
    const ins=await supabase.from('senior_settings').insert({senior_id:uid}).select().single();
    st=ins.data;
  }
  S.settings=st||{status:'waiting',plan:'free',whatsapp_daily:false};
  const {data:gs}=await supabase.from('guardians').select('*').eq('senior_id',uid).order('created_at');
  S.guardians=gs||[];
  const {data:ev}=await supabase.from('check_in_events').select('*').eq('senior_id',uid).order('created_at',{ascending:false}).limit(20);
  S.events=ev||[];
  const {data:prof}=await supabase.from('profiles').select('full_name').eq('id',uid).maybeSingle();
  S.profileName=(prof&&prof.full_name)||'';
}
async function saveSeniorSetup(name,time){
  const uid=S.user.id;
  await supabase.from('profiles').update({full_name:name}).eq('id',uid);
  await supabase.from('senior_settings').update({check_in_time:time}).eq('senior_id',uid);
  S.profileName=name; S.settings.check_in_time=time;
  await loadSeniorData(); S.screen='senior'; render(); toast('Saved');
}
async function logEvent(type,detail,extra={}){
  await supabase.from('check_in_events').insert(Object.assign({senior_id:S.user.id,type,detail},extra));
}
async function checkIn(){
  clearEsc();
  await supabase.from('senior_settings').update({status:'ok',last_check_in_at:new Date().toISOString()}).eq('senior_id',S.user.id);
  await logEvent('checkin','Tapped "I\'m OK".');
  const linked=S.guardians.filter(g=>g.linked);
  if(S.settings.whatsapp_daily){for(const g of linked){await logEvent('reassure','Reassurance queued for '+g.name+' (email/push).',{channel:'email'});}}
  await loadSeniorData();render();toast('Checked in — you\'re all set for today');
}
async function addGuardian(name,email){
  if(S.guardians.length>=(S.settings.plan==='free'?1:5))return;
  const c=code6();
  const {error}=await supabase.from('guardians').insert({senior_id:S.user.id,name,email,link_code:c,channel:'email'});
  if(error){toast(error.message);return;}
  await logEvent('invite','Invite created for '+name+' <'+email+'> (code '+c+').');
  await loadSeniorData();render();
}
async function removeGuardian(id){await supabase.from('guardians').delete().eq('id',id);await loadSeniorData();render();}
async function setWhatsappDaily(v){await supabase.from('senior_settings').update({whatsapp_daily:v}).eq('senior_id',S.user.id);S.settings.whatsapp_daily=v;render();}
async function setPlan(p){await supabase.from('senior_settings').update({plan:p}).eq('senior_id',S.user.id);S.settings.plan=p;await loadSeniorData();render();}

async function simulateMissed(){
  clearEsc();sheetOpen=false;
  await supabase.from('senior_settings').update({status:'grace'}).eq('senior_id',S.user.id);
  S.settings.status='grace';S.stepIdx=0;S.gpsShared=false;
  await logEvent('missed','Check-in window passed. Grace period started.');
  await loadSeniorData();render();
  CHAIN.forEach((s,i)=>{escTimers.push(setTimeout(async()=>{
    S.stepIdx=i;
    if(s.key==='fs'){
      await supabase.from('senior_settings').update({status:'alert'}).eq('senior_id',S.user.id);
      S.settings.status='alert';S.gpsShared=true;
      await logEvent('gps','Location captured on missed check-in: '+LOC.lat+', '+LOC.lng,{lat:LOC.lat,lng:LOC.lng});
      const targets=S.guardians.filter(g=>g.linked);
      for(const g of (targets.length?targets:S.guardians.slice(0,1))){await logEvent('alert','Alert to '+g.name+' (push + email): no check-in from senior. Last location '+LOC.place+'.',{channel:'email'});}
    } else {await logEvent('escalate',s.title+' — '+s.detail);}
    await loadSeniorData();render();
  }, (i+1)*3000));});
}
async function resetDay(){clearEsc();sheetOpen=false;await supabase.from('senior_settings').update({status:'waiting'}).eq('senior_id',S.user.id);S.settings.status='waiting';S.stepIdx=-1;S.gpsShared=false;await loadSeniorData();render();}

/* ============ data: guardian ============ */
async function linkByCode(codeStr){
  try{
    const {data,error}=await supabase.rpc('link_guardian',{p_code:String(codeStr).trim()});
    if(error) throw error;
    S.role='guardian';localStorage.setItem('imfine_role','guardian');
    await loadGuardianData();render();toast('Linked successfully');
    return true;
  }catch(e){return false;}
}
async function loadGuardianData(){
  stopPoll();
  const {data:links}=await supabase.from('guardians').select('*').eq('guardian_user_id',S.user.id).eq('linked',true).order('created_at');
  if(!links||!links.length){S.screen='guardianLink';S.gLink=null;return;}
  S.gLink=links[0];
  const sid=S.gLink.senior_id;
  const {data:st}=await supabase.from('senior_settings').select('*').eq('senior_id',sid).maybeSingle();
  S.settings=st||{status:'waiting'};
  S.gpsShared=(st&&st.status==='alert');
  const {data:prof}=await supabase.from('profiles').select('full_name').eq('id',sid).maybeSingle();
  S.seniorName=(prof&&prof.full_name)||'your loved one';
  const {data:ev}=await supabase.from('check_in_events').select('*').eq('senior_id',sid).order('created_at',{ascending:false}).limit(12);
  S.events=ev||[];
  S.screen='guardian';
  pollTimer=setInterval(refreshGuardian,5000);
}
async function refreshGuardian(){
  if(S.screen!=='guardian'||!S.gLink)return;
  const sid=S.gLink.senior_id;
  const {data:st}=await supabase.from('senior_settings').select('*').eq('senior_id',sid).maybeSingle();
  if(st){S.settings=st;S.gpsShared=(st.status==='alert');}
  const {data:ev}=await supabase.from('check_in_events').select('*').eq('senior_id',sid).order('created_at',{ascending:false}).limit(12);
  S.events=ev||[];render();
}

  return `<div class="sheet"><div class="inner"><div class="between"><b>Settings</b><button class="trash" data-a="close-sheet">${I.trash}</button></div>
  ${senior?`<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><button class="btn btn-green" data-a="enable-push">${I.bell}<span>Turn on notifications</span></button><button class="btn btn-ghost" data-a="edit-details">Edit name &amp; time</button><button class="btn btn-ghost" data-a="sign-out">Sign out</button></div>`
  :`<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><button class="btn btn-green" data-a="enable-push">${I.bell}<span>Turn on notifications</span></button><button class="btn btn-ghost" data-a="sign-out">Sign out</button></div>`}
  ${legal}
  </div></div>`;
}
function topbar(label,action,tint){const c=tint==='sky'?'var(--sky)':'var(--green-d)';return `<div class="topbar"><button class="back" data-a="${action}">${action==='open-menu'?I.gear:I.back}</button><span class="barlabel" style="color:${c}">${label}</span></div>`;}

/* ============ render ============ */
function render(){
  const app=document.getElementById('app');
  let html='';
  switch(S.screen){
    case 'loading':html='<div class="spin"></div>';break;
    case 'welcome':html=screenWelcome();break;
    case 'auth':html=screenAuth();break;
    case 'senior':html=screenSenior();break;
    case 'seniorSetup':html=screenSeniorSetup();break;
    case 'guardianLink':html=screenGuardianLink();break;
    case 'guardian':html=screenGuardian();break;
    default:html=screenWelcome();
  }
  app.innerHTML=html+menuSheet();
  document.querySelector('meta[name=theme-color]').setAttribute('content',(S.screen==='guardian'||S.screen==='guardianLink'||(S.screen==='auth'&&S.role==='guardian'))?'#0284c7':'#10b981');
}

/* ============ events ============ */
document.getElementById('app').addEventListener('click',async(e)=>{
  if(e.target.classList&&e.target.classList.contains('sheet')){sheetOpen=false;render();return;}
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.getAttribute('data-a');
  switch(a){
    case 'choose-senior':await chooseRole('senior');break;
    case 'choose-guardian':await chooseRole('guardian');break;
    case 'auth-toggle':authMode=(authMode==='signup'?'signin':'signup');render();break;
    case 'auth-go':{const em=document.getElementById('au-email').value.trim();const pw=document.getElementById('au-pass').value;if(!em||!pw){toast('Enter email and password');break;}t.disabled=true;await doAuth(em,pw);break;}
    case 'save-setup':{const n=document.getElementById('se-name').value.trim();const tm=document.getElementById('se-time').value||'09:00';if(!n){toast('Please enter your name');break;}await saveSeniorSetup(n,tm);break;}
    case 'edit-details':sheetOpen=false;S.screen='seniorSetup';render();break;
    case 'enable-push':await subscribePush();break;
    case 'disable-push':await unsubscribePush();break;
    case 'upgrade-monthly':await upgradeTo('monthly');break;
    case 'open-portal':await openPortal();break;
    case 'upgrade-yearly':await upgradeTo('yearly');break;
    case 'go-senior':S.screen='senior';render();break;
    case 'check-in':await checkIn();break;
    case 'toggle-daily':await setWhatsappDaily(!S.settings.whatsapp_daily);break;
    case 'show-add':S._adding=true;render();break;
    case 'cancel-add':S._adding=false;render();break;
    case 'submit-g':{const n=document.getElementById('g-name').value.trim();const em=document.getElementById('g-email').value.trim();if(n&&em){S._adding=false;await addGuardian(n,em);}break;}
    case 'rm-g':await removeGuardian(t.getAttribute('data-id'));break;
    case 'go-welcome':goWelcome();break;
    case 'link-go':{const v=document.getElementById('code-in').value;const ok=await linkByCode(v);if(!ok)document.getElementById('code-err').classList.remove('hidden');break;}
    case 'open-menu':sheetOpen=true;render();break;
    case 'open-test':sheetOpen=true;render();break;
    case 'close-sheet':sheetOpen=false;render();break;
    case 'sim-missed':await simulateMissed();break;
    case 'reset-day':await resetDay();break;
    case 'plan-free':await setPlan('free');break;
    case 'plan-premium':await setPlan('premium');break;
    case 'sign-out':await signOut();break;
  }
});

/* ============ boot ============ */
// Service worker is for the WEB/PWA only. Inside the native app it caches
// pages and causes stale or blank screens after each deploy, so we disable
// it there and remove any copy left over from earlier installs.
if (isNative()) {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
    if (window.caches && caches.keys) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(()=>{});
  }
} else if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
boot();
</script>
